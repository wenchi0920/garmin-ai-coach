settings:
  deleteSameNameWorkout: true

workouts:
  "W32-修復瑜伽-睡前舒緩伸展 (0803)":
    - sport: yoga
    - warmup: 5min @note(腹式呼吸)
    - interval: 2min @note(下犬式：延伸小腿與足底)
    - interval: 3min @note(鴿式-左：釋放髖關節壓力)
    - interval: 3min @note(鴿式-右：釋放髖關節壓力)
    - interval: 10min @note(靠牆掛腿：促進下肢血液回流)
    - cooldown: 3min @note(大休息)

  "W32-5km Z1/Z2 恢復跑 (0803)":
    - warmup: 1km @H(134-153) @note(Z1 暖身)
    - run: 3km @H(134-153) @note(恢復慢跑，步頻 170+)
    - cooldown: 1km @H(134-153) @note(Z1 緩跑)

  "W32-上半身重訓 (0803)":
    - sport: strength
    - warmup: 10min @note(動態伸展與核心啟動)
    - repeat(3):
      - interval: 15reps @note(啞鈴划船)
      - interval: 15reps @note(死蟲式)
    - cooldown: 5min @note(上半身拉伸)

  "W32-12km T 門檻跑 (0804)":
    - warmup: 2km @H(153-166) @note(Z2 暖身，可加強髖關節活動度)
    - run: 8km @H(171-180) @note(T 門檻配速 6:07, 步頻 170+，模擬雪梨起伏地形)
    - cooldown: 2km @H(134-153) @note(Z1 緩跑)

  "W32-跑者核心 (Bodyweight) (0804)":
    - sport: strength
    - warmup: 5min @note(核心啟動)
    - repeat(3):
      - interval: 15reps @note(死蟲式)
      - interval: 30s @note(側棒式-左)
      - interval: 30s @note(側棒式-右)
    - cooldown: 5min @note(拉伸)

  "W32-8km Z2 基礎有氧 (0806)":
    - warmup: 1km @H(134-153) @note(Z1 暖身)
    - run: 6km @H(153-166) @note(Z2 基礎有氧，步頻 170+，若用跑步機設定 1.5% 坡度)
    - cooldown: 1km @H(134-153) @note(Z1 緩跑)

  "W32-下半身重訓 (0806)":
    - sport: strength
    - warmup: 10min @note(動態伸展與核心啟動)
    - repeat(3):
      - interval: 10reps @note(單腳硬舉-左)
      - interval: 10reps @note(單腳硬舉-右)
      - interval: 12reps @note(保加利亞分腿蹲-左)
      - interval: 12reps @note(保加利亞分腿蹲-右)
    - cooldown: 5min @note(下肢拉伸)

  "W32-跑者功能性肌力 (0807)":
    - sport: strength
    - warmup: 5min @note(關節活動)
    - repeat(3):
      - interval: 12reps @note(單腳橋式-左)
      - interval: 12reps @note(單腳橋式-右)
      - interval: 15reps @note(登階-左)
      - interval: 15reps @note(登階-右)
    - cooldown: 5min @note(拉伸放鬆)

  "W32-20km LSD 長跑 (0808)":
    - warmup: 1km @H(134-153) @note(Z1 暖身)
    - run: 18km @H(153-166) @note(Z2 LSD, 步頻 170+，每5-6km補膠/水分，富士山錦標賽 & ONE TOKYO 線上賽)
    - cooldown: 1km @H(134-153) @note(Z1 緩跑)

schedulePlan:
  start_from: 2026-08-03
