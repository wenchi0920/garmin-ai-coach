      - "W32-跑者核心 (Bodyweight) (0804)"
      - "W32-修復瑜伽-睡前舒緩伸展 (0803)"
    - "W32-修復瑜伽-睡前舒緩伸展 (0803)"
    - - "W32-8km Z2 基礎有氧 (0806)"
      - "W32-下半身重訓 (0806)"
      - "W32-修復瑜伽-睡前舒緩伸展 (0803)"
